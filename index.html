<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detection Report</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #0d1117;
        color: #e6edf3;
      }

      main {
        width: min(90vw, 680px);
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 28px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 18px;
        font-size: 1.7rem;
      }

      p {
        margin: 10px 0;
        line-height: 1.45;
        font-size: 1.05rem;
      }

      .status {
        color: #3fb950;
        font-weight: 700;
      }

      .percent {
        font-weight: 700;
        color: #f2cc60;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Detections on paste:</h1>
      <p><strong>Nebula Solutions</strong> : <span class="status">Detected</span> : Luna.vip leak</p>
      <p>paste percent : <span class="percent">100%</span></p>
    </main>
  </body>
</html>
